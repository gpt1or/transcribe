[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hebrew-transcribe"
dynamic = ["version"]
description = "Private, local Hebrew speech-to-text with optional speaker labels (faster-whisper + ivrit.ai models)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gpt1or" }]
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1.0",
    "huggingface_hub>=0.23",
    "truststore>=0.9",
]
keywords = ["hebrew", "speech-to-text", "transcription", "whisper", "asr", "diarization", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
diarize = ["pyannote.audio>=4.0"]

[project.scripts]
transcribe = "hebrew_transcribe.cli:run"
hebrew-transcribe = "hebrew_transcribe.cli:run"

[project.urls]
Homepage = "https://github.com/gpt1or/transcribe"
Issues = "https://github.com/gpt1or/transcribe/issues"
Changelog = "https://github.com/gpt1or/transcribe/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "hebrew_transcribe._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hebrew_transcribe = ["py.typed"]
