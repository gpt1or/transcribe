name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel with its dependencies
        run: python -m pip install dist/*.whl
      - name: Smoke test the commands
        run: |
          transcribe --version
          hebrew-transcribe --help
          python -m hebrew_transcribe --version
      - name: Versions of the audio stack
        run: >-
          python -c "from importlib.metadata import version;
          print({p: version(p) for p in ('faster-whisper', 'av', 'ctranslate2', 'onnxruntime', 'numpy')})"
      - name: Unit tests (offline; the speech models are replaced by fakes)
        run: python -m unittest discover -s tests -v

  # The one check that the branch rules of main require. It passes only when
  # every job of the matrix above passed, so Python versions can be added or
  # removed there without changing the rules.
  tests-passed:
    name: tests passed
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
